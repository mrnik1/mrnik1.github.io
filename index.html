```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Physics</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #game {
        display: block;
        background: #181818;
        cursor: crosshair;
    }

    #ui {
        position: fixed;
        top: 15px;
        left: 15px;
        background: rgba(20, 20, 20, 0.9);
        padding: 15px;
        border-radius: 10px;
        width: 230px;
        user-select: none;
    }

    #ui h2 {
        margin: 0 0 12px 0;
        font-size: 20px;
    }

    .control {
        margin: 10px 0;
    }

    .control label {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
    }

    input[type="range"] {
        width: 100%;
    }

    button {
        width: 100%;
        padding: 9px;
        margin-top: 6px;
        border: 0;
        border-radius: 6px;
        background: #287be0;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #3990f5;
    }

    #hint {
        margin-top: 10px;
        font-size: 12px;
        color: #aaa;
        line-height: 1.4;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <h2>Liquid Physics</h2>

    <div class="control">
        <label>
            Gravity:
            <span id="gravityValue">0.35</span>
        </label>
        <input id="gravity" type="range"
               min="0"
               max="1"
               step="0.01"
               value="0.35">
    </div>

    <div class="control">
        <label>
            Viscosity:
            <span id="viscosityValue">0.92</span>
        </label>
        <input id="viscosity" type="range"
               min="0.80"
               max="0.99"
               step="0.01"
               value="0.92">
    </div>

    <div class="control">
        <label>
            Liquid:
            <span id="amountValue">250</span>
        </label>
        <input id="amount" type="range"
               min="50"
               max="600"
               step="10"
               value="250">
    </div>

    <button id="add">Add Liquid</button>
    <button id="reset">Reset</button>

    <div id="hint">
        Click and drag to push the liquid.<br>
        Hold the mouse to create a stream.
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ============================================================
// LIQUID PARTICLES
// ============================================================

const particles = [];

const particleRadius = 4;
const maxSpeed = 12;

let gravity = 0.35;
let viscosity = 0.92;


// ============================================================
// WALLS
// ============================================================

const walls = [
    // Floor
    {
        x1: 0,
        y1: 0.88,
        x2: 1,
        y2: 0.88
    },

    // Left wall
    {
        x1: 0,
        y1: 0,
        x2: 0,
        y2: 0.88
    },

    // Right wall
    {
        x1: 1,
        y1: 0,
        x2: 1,
        y2: 0.88
    },

    // Small platform
    {
        x1: 0.30,
        y1: 0.70,
        x2: 0.70,
        y2: 0.70
    }
];


// ============================================================
// PARTICLE CREATION
// ============================================================

function createParticle(x, y) {

    particles.push({
        x: x,
        y: y,

        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,

        radius: particleRadius
    });
}


function addLiquid(amount) {

    for (let i = 0; i < amount; i++) {

        const x =
            width * 0.5 +
            (Math.random() - 0.5) * 150;

        const y =
            height * 0.2 +
            Math.random() * 50;

        createParticle(x, y);
    }
}


// ============================================================
// MOUSE
// ============================================================

let mouse = {
    x: 0,
    y: 0,
    px: 0,
    py: 0,
    down: false
};

canvas.addEventListener("mousemove", e => {

    mouse.px = mouse.x;
    mouse.py = mouse.y;

    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener("mousedown", e => {

    mouse.down = true;

    mouse.x = e.clientX;
    mouse.y = e.clientY;

    // Spawn some liquid where the mouse is
    for (let i = 0; i < 4; i++) {
        createParticle(
            mouse.x + (Math.random() - 0.5) * 15,
            mouse.y + (Math.random() - 0.5) * 15
        );
    }
});

window.addEventListener("mouseup", () => {
    mouse.down = false;
});


// ============================================================
// PHYSICS
// ============================================================

function distance(x1, y1, x2, y2) {

    const dx = x2 - x1;
    const dy = y2 - y1;

    return Math.sqrt(dx * dx + dy * dy);
}


function particleCollision(a, b) {

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    const minDist = a.radius + b.radius;

    if (dist < minDist && dist > 0) {

        const nx = dx / dist;
        const ny = dy / dist;

        const overlap = minDist - dist;

        // Separate particles
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;

        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        // Exchange velocity along collision normal
        const relativeVelocity =
            (b.vx - a.vx) * nx +
            (b.vy - a.vy) * ny;

        if (relativeVelocity < 0) {

            const impulse = relativeVelocity * 0.5;

            a.vx += impulse * nx;
            a.vy += impulse * ny;

            b.vx -= impulse * nx;
            b.vy -= impulse * ny;
        }
    }
}


// ============================================================
// WALL COLLISION
// ============================================================

function collideWithWall(p, wall) {

    const x1 = wall.x1 * width;
    const y1 = wall.y1 * height;

    const x2 = wall.x2 * width;
    const y2 = wall.y2 * height;

    const dx = x2 - x1;
    const dy = y2 - y1;

    const length = Math.sqrt(dx * dx + dy * dy);

    const nx = -dy / length;
    const ny = dx / length;

    const t =
        ((p.x - x1) * dx +
         (p.y - y1) * dy) /
        (length * length);

    const clampedT = Math.max(0, Math.min(1, t));

    const closestX = x1 + dx * clampedT;
    const closestY = y1 + dy * clampedT;

    const diffX = p.x - closestX;
    const diffY = p.y - closestY;

    const dist = Math.sqrt(diffX * diffX + diffY * diffY);

    if (dist < p.radius) {

        let normalX;
        let normalY;

        if (dist > 0) {
            normalX = diffX / dist;
            normalY = diffY / dist;
        } else {
            normalX = nx;
            normalY = ny;
        }

        const overlap = p.radius - dist;

        p.x += normalX * overlap;
        p.y += normalY * overlap;

        const velocityIntoWall =
            p.vx * normalX +
            p.vy * normalY;

        if (velocityIntoWall < 0) {

            p.vx -= velocityIntoWall * normalX;
            p.vy -= velocityIntoWall * normalY;

            // Small amount of bounce
            p.vx *= 0.85;
            p.vy *= 0.85;
        }

        // Friction
        p.vx *= 0.98;
    }
}


// ============================================================
// MOUSE FORCE
// ============================================================

function mouseInteraction(p) {

    if (!mouse.down)
        return;

    const dx = p.x - mouse.x;
    const dy = p.y - mouse.y;

    const dist = Math.sqrt(dx * dx + dy * dy);

    const radius = 90;

    if (dist < radius) {

        const strength = 1 - dist / radius;

        const mouseVX = mouse.x - mouse.px;
        const mouseVY = mouse.y - mouse.py;

        p.vx += mouseVX * strength * 0.45;
        p.vy += mouseVY * strength * 0.45;
    }
}


// ============================================================
// UPDATE
// ============================================================

function update() {

    // Apply forces
    for (const p of particles) {

        p.vy += gravity;

        mouseInteraction(p);

        p.vx *= viscosity;
        p.vy *= viscosity;

        // Limit velocity
        const speed =
            Math.sqrt(p.vx * p.vx + p.vy * p.vy);

        if (speed > maxSpeed) {

            p.vx =
                (p.vx / speed) * maxSpeed;

            p.vy =
                (p.vy / speed) * maxSpeed;
        }

        p.x += p.vx;
        p.y += p.vy;
    }


    // Particle collisions
    for (let i = 0; i < particles.length; i++) {

        for (let j = i + 1; j < particles.length; j++) {

            particleCollision(
                particles[i],
                particles[j]
            );
        }
    }


    // Wall collisions
    for (const p of particles) {

        for (const wall of walls) {
            collideWithWall(p, wall);
        }
    }
}


// ============================================================
// DRAW
// ============================================================

function draw() {

    ctx.clearRect(0, 0, width, height);


    // Background
    ctx.fillStyle = "#181818";
    ctx.fillRect(0, 0, width, height);


    // Walls
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";

    for (const wall of walls) {

        ctx.beginPath();

        ctx.moveTo(
            wall.x1 * width,
            wall.y1 * height
        );

        ctx.lineTo(
            wall.x2 * width,
            wall.y2 * height
        );

        ctx.stroke();
    }


    // Liquid
    for (const p of particles) {

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#2499ff";
        ctx.fill();
    }


    // Mouse interaction radius
    if (mouse.down) {

        ctx.beginPath();

        ctx.arc(
            mouse.x,
            mouse.y,
            90,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "rgba(80,170,255,0.15)";

        ctx.lineWidth = 2;
        ctx.stroke();
    }
}


// ============================================================
// LOOP
// ============================================================

function loop() {

    mouse.px = mouse.x;
    mouse.py = mouse.y;

    update();
    draw();

    requestAnimationFrame(loop);
}


// ============================================================
// UI
// ============================================================

const gravitySlider =
    document.getElementById("gravity");

const viscositySlider =
    document.getElementById("viscosity");

const amountSlider =
    document.getElementById("amount");

gravitySlider.addEventListener("input", () => {

    gravity = Number(gravitySlider.value);

    document.getElementById("gravityValue")
        .textContent = gravity.toFixed(2);
});


viscositySlider.addEventListener("input", () => {

    viscosity = Number(viscositySlider.value);

    document.getElementById("viscosityValue")
        .textContent = viscosity.toFixed(2);
});


amountSlider.addEventListener("input", () => {

    document.getElementById("amountValue")
        .textContent = amountSlider.value;
});


document.getElementById("add").onclick = () => {

    addLiquid(
        Number(amountSlider.value)
    );
};


document.getElementById("reset").onclick = () => {

    particles.length = 0;

    addLiquid(
        Number(amountSlider.value)
    );
};


// Initial liquid
addLiquid(250);

loop();

</script>

</body>
</html>
```
